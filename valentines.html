<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Date?</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: pink;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.5s ease-in-out;
        }
        h1 {
            color: red;
            font-weight: bold;
        }
        .buttons {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px; /* Ensures proper spacing between buttons */
        }
        .btn {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            transition: transform 0.2s ease-in-out;
        }
        .btn:hover {
            transform: scale(1.1); /* Slight scale effect on hover */
        }
        .yes {
            background-color: red;
            color: white;
        }
        .no {
            background-color: gray;
            color: white;
            position: absolute;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: pink;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .modal img {
            width: 200px;
            height: auto;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="tenor-gif-embed" data-postid="13009815" data-share-method="host" data-aspect-ratio="1.69" data-width="100%">
            <a href="https://tenor.com/view/love-for-you-rose-gif-13009815">Love For You Sticker</a> from <a href="https://tenor.com/search/love-stickers">Love Stickers</a>
        </div>
        <script type="text/javascript" async src="https://tenor.com/embed.js"></script>
        <h1>Will you be my Valentine? ❤️</h1>
        <div class="buttons">
            <button class="btn yes" onclick="yesClicked()">Yes</button>
            <button class="btn no" id="noButton" onmouseover="moveButton()">No</button>
        </div>
    </div>
    
    <div id="myModal" class="modal">
        <div class="modal-content">
            <h2>YAAY! I Love You! ❤️</h2>
            <img id="loveImage" src="./baho.jpg" alt="Love Image">
            <br>
            <button onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        function yesClicked() {
            document.getElementById("container").style.transform = "scale(1.1)";
            let modal = document.getElementById("myModal");
            modal.style.display = "flex";
        }
        
        function closeModal() {
            document.getElementById("myModal").style.display = "none";
        }
        
        function moveButton() {
            let noButton = document.getElementById("noButton");
            let maxX = window.innerWidth - noButton.clientWidth - 20; // Prevents button from going off-screen
            let maxY = window.innerHeight - noButton.clientHeight - 20;
            let x = Math.random() * maxX;
            let y = Math.random() * maxY;
            noButton.style.left = `${x}px`;
            noButton.style.top = `${y}px`;
        }
    </script>
</body>
</html>
